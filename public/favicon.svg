<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded Squircle Badge -->
  <rect width="100" height="100" rx="22" ry="22" fill="#ffffff" />
  <rect x="1" y="1" width="98" height="98" rx="21" ry="21" fill="none" stroke="#e2e8f0" stroke-width="2" />

  <!-- The "P" Stem -->
  <rect x="14" y="14" width="16" height="72" rx="2" fill="#1b212f" />

  <!-- Outer Dark Ring for P Loop -->
  <circle cx="56" cy="44" r="32" fill="#1b212f" />

  <!-- Silver Contour Hairline -->
  <circle cx="56" cy="44" r="29.5" fill="#e2e8f0" />

  <!-- Crimson Red 8-Ball Disc -->
  <circle cx="56" cy="44" r="27" fill="#b91c28" />

  <!-- 3D Crescent Shadow on Right -->
  <path d="M56 17 A 27 27 0 0 1 83 44 A 27 27 0 0 1 56 71 Z" fill="#7a0f18" opacity="0.35" />

  <!-- Center White Disc -->
  <circle cx="56" cy="44" r="15" fill="#ffffff" />

  <!-- Center 8 Numeral -->
  <text
    x="56"
    y="51.5"
    text-anchor="middle"
    fill="#111827"
    font-family="'JetBrains Mono', 'Oswald', Arial, sans-serif"
    font-weight="900"
    font-size="22"
    letter-spacing="-0.5"
  >8</text>
</svg>